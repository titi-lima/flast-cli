[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flast-cli"
version = "0.1.0"
description = "Headless CLI wrapper for FLAST flaky-test detection"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    {name = "Tiago"},
]
requires-python = ">=3.9"
dependencies = [
    "joblib",
    "numpy",
    "scikit-learn",
    "scipy",
    "tomli; python_version < '3.11'",
]

[project.scripts]
flast = "flast_cli.cli:main"

[project.entry-points.pytest11]
flast = "flast_cli.integrations.pytest.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["flast_cli*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
flast_cli = [
    "integrations/vitest/flast-reporter.cjs",
    "integrations/junit/FlastJUnitListener.java",
]
